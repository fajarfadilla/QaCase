name: Automation
on:
  push:
    branches: [main, master]
    paths: ['automation/**', '.github/workflows/automation.yml']
  pull_request:
    branches: [main, master]
    paths: ['automation/**', '.github/workflows/automation.yml']
jobs:
  check:
    # The specs are examples only (AS-34): there is no WeMine environment to run them against,
    # so CI checks that they are formatted, compile, and are discovered by Playwright.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm install -g pnpm && pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: List specs
        run: pnpm test:list
